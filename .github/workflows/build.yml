name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore NovaWorkspace.sln
      - name: Build
        run: dotnet build NovaWorkspace.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Nova.Core.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Publish
        run: dotnet publish src/Nova.App -c Release -r win-x64 --self-contained false -o artifacts/NovaWorkspace
      - name: Shell integration self-test
        # Hosted runners have a desktop session, but Shell behaviour there is not guaranteed; the result is
        # informative. The authoritative run is on a real Windows 11 desktop (see docs/TESTING.md).
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process artifacts/NovaWorkspace/NovaWorkspace.exe -ArgumentList '--selftest', "$PWD/selftest-report.md" -PassThru -Wait
          Get-Content selftest-report.md
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaWorkspace-win-x64
          path: |
            artifacts/NovaWorkspace
            selftest-report.md
