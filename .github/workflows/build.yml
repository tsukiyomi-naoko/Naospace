name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NovaWorkspace.slnx

      - name: Build
        run: dotnet build NovaWorkspace.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Nova.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/Nova.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - name: UI smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/NovaWorkspace.exe -ArgumentList '--smoke-test' -PassThru -Wait
          $log = Join-Path $env:LOCALAPPDATA 'NovaWorkspace/nova.log'
          if (Test-Path $log) { Get-Content $log | Where-Object { $_ -notmatch 'BINDING' } }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Collect smoke artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item (Join-Path $env:LOCALAPPDATA 'NovaWorkspace/*') smoke -Recurse -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: smoke

      - uses: actions/upload-artifact@v4
        with:
          name: NovaWorkspace-win-x64
          path: publish/NovaWorkspace.exe
